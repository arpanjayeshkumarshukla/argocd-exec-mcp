[project]
name = "argocd-exec-mcp"
version = "0.1.0"
description = "Persistent multi-command exec sessions into pods via ArgoCD's terminal API, as a CLI and an MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "websocket-client>=1.6",
    "PyYAML>=6.0",
    "certifi",
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "bandit>=1.7",
    "pre-commit>=3.5",
]

[project.scripts]
argocd-exec = "argocd_exec_mcp.cli:main"
argocd-exec-mcp-server = "argocd_exec_mcp.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["argocd_exec_mcp*"]

[tool.setuptools.package-data]
argocd_exec_mcp = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = false
